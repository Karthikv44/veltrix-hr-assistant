[project]
name = "veltrix-peopleops"
version = "0.1.0"
description = "Veltrix PeopleOps Assistant - Production-grade HR Q&A and Leave Management Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.156.4",
    "fastembed>=0.9.0",
    "google-genai>=2.32.0",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "openai>=3.35.1",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veltrix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function call in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["veltrix"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/veltrix"]
omit = ["tests/*"]
